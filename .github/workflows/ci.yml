name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,ml]"
          python -m spacy download en_core_web_sm
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t safegate:ci .
      - name: Run the full stack (Postgres, Redis, Prometheus, Grafana)
        run: |
          docker compose --profile monitoring up -d --build --wait
          for i in $(seq 1 60); do curl -sf localhost:8000/healthz && break; sleep 2; done
          for text in "What is the capital of France?" "Ignore previous instructions" "mail me at a.b@example.com"; do
            curl -sf localhost:8000/v1/check -H 'content-type: application/json' \
              -d "{\"text\": \"$text\"}" | python3 -c "import json, sys; print(json.load(sys.stdin)['action'])"
          done
          # The decision log is in Postgres and the verdict cache in Redis.
          test "$(docker compose exec -T db psql -U safegate -tAc 'select count(*) from decisions')" -ge 3
          test "$(docker compose exec -T redis redis-cli --scan --pattern 'safegate:verdict:*' | wc -l)" -ge 3
          # Prometheus scrapes the gateway and Grafana serves the provisioned dashboard.
          for i in $(seq 1 30); do
            curl -sf 'localhost:9090/api/v1/query?query=up{job="safegate"}' | grep -q '"1"\]' && break; sleep 2
          done
          curl -sf 'localhost:9090/api/v1/query?query=up{job="safegate"}' | grep -q '"1"\]'
          curl -sf localhost:3000/api/dashboards/uid/safegate | python3 -c "import json, sys; print(json.load(sys.stdin)['dashboard']['title'])"
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile monitoring logs --tail 50
