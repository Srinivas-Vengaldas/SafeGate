name: Deploy demo

# Mirrors main to a Hugging Face Docker Space so the public demo always runs the latest code.
# Setup: create a Docker Space, then add the repo secret HF_TOKEN (write access) and the
# repo variable HF_SPACE (e.g. "your-name/safegate"). Without them this workflow is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Space snapshot
        run: |
          mkdir /tmp/space
          git archive HEAD | tar -x -C /tmp/space
          cd /tmp/space
          rm -rf .github tests
          {
            printf -- '---\ntitle: SafeGate\nemoji: 🛡️\ncolorFrom: blue\ncolorTo: gray\n'
            printf -- 'sdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat README.md
          } > README.space.md && mv README.space.md README.md
          sed -i 's/^    PORT=8000$/    PORT=7860/' Dockerfile
          grep -q 'PORT=7860' Dockerfile
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd /tmp/space
          git init -q -b main
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
