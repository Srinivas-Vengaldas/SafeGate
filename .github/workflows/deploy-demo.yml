name: Deploy demo

# Deploys the gateway and demo page to Google Cloud Run, with the injection classifier from the
# latest successful training run baked into the image. See docs/deploy-demo.md for the one-time
# Google Cloud setup. Without the GCP_SA_KEY secret and GCP_PROJECT variable this is skipped.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Train injection classifier]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT != '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION || 'us-east1' }}
      SERVICE: safegate
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the latest trained classifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow train.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful training run yet; deploying without the injection rail"
            exit 0
          fi
          gh run download "$run_id" --name injection-model --dir models/injection-deberta
          gh run download "$run_id" --name reports --dir /tmp/reports
          threshold=$(python -c "import json; print(json.load(open('/tmp/reports/metrics.json'))['threshold'])")
          printf '  injection:\n    model: models/injection-deberta\n    threshold: %s\n' "$threshold" \
            >> policies/default.yaml
          # Ship the model inside the image for this deploy only.
          sed -i '/^models$/d' .dockerignore
          sed -i 's#^COPY policies ./policies$#COPY policies ./policies\nCOPY models ./models#' Dockerfile
          grep -q '^COPY models' Dockerfile
          echo "Using model from training run $run_id with threshold $threshold"
          tail -4 policies/default.yaml

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT }}" \
            --region "$REGION" \
            --source . \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 60 \
            --quiet
          url=$(gcloud run services describe "$SERVICE" --project "${{ vars.GCP_PROJECT }}" \
            --region "$REGION" --format 'value(status.url)')
          echo "Demo live at $url" | tee -a "$GITHUB_STEP_SUMMARY"
