name: Train injection classifier

# Builds the dataset, fine-tunes DeBERTa-v3-small on CPU and evaluates it against the
# rules-only baseline. Metrics land in the job summary and the "reports" artifact; the model
# lands in the "injection-model" artifact and, if HF_TOKEN and HF_MODEL_REPO are configured,
# on the Hugging Face Hub, where the public demo loads it from. The reports are also committed
# to a `training-results/<run id>` branch so they can be merged into the README.

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        default: "3"
      max_train_samples:
        description: Cap on training examples (blank = all)
        default: ""
      reuse_model_run:
        description: Skip training and re-evaluate the model from this earlier run ID
        default: ""
      push_to_hub:
        description: Upload the model to HF_MODEL_REPO (when configured)
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train]"
      - name: Build dataset
        run: python -m training.build_dataset --out data
      - name: Download model from an earlier run
        if: inputs.reuse_model_run != ''
        uses: actions/download-artifact@v4
        with:
          name: injection-model
          path: models/injection-deberta
          run-id: ${{ inputs.reuse_model_run }}
          github-token: ${{ github.token }}
      - name: Train
        if: inputs.reuse_model_run == ''
        run: |
          python -m training.train --data data --out models/injection-deberta \
            --epochs "${{ inputs.epochs }}" \
            ${{ inputs.max_train_samples && format('--max-train-samples {0}', inputs.max_train_samples) || '' }}
      - name: Evaluate
        run: |
          python -m training.evaluate --model models/injection-deberta --data data --out reports
          cp data/stats.json reports/dataset_stats.json
          {
            echo "## Injection classifier results"
            echo
            cat reports/metrics.md
            echo
            echo "Dataset: \`reports/dataset_stats.json\` in the reports artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Export to ONNX (int8) and evaluate it as served
        run: |
          python -m training.export_onnx --model models/injection-deberta --out models/injection-onnx
          python -m training.evaluate --model models/injection-onnx --data data \
            --out reports/onnx --max-windows 4
          {
            echo "## Served model: ONNX int8, at most 4 windows per prompt"
            echo
            cat reports/onnx/metrics.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit reports to a results branch
        run: |
          branch="training-results/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -f reports/
          git commit -m "Training results from run ${GITHUB_RUN_ID}"
          git push origin "$branch"
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
      - uses: actions/upload-artifact@v4
        with:
          name: injection-onnx
          path: models/injection-onnx/
      - uses: actions/upload-artifact@v4
        with:
          name: injection-model
          path: |
            models/injection-deberta/
            !models/injection-deberta/checkpoints/
      - name: Push model to Hugging Face Hub
        if: inputs.push_to_hub && vars.HF_MODEL_REPO != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_MODEL_REPO"]
          api.create_repo(repo, exist_ok=True)
          api.upload_folder(
              repo_id=repo,
              folder_path="models/injection-deberta",
              ignore_patterns=["checkpoints/*"],
              commit_message=f"Train {os.environ['GITHUB_SHA'][:7]}",
          )
          api.upload_folder(repo_id=repo, folder_path="reports", path_in_repo="reports")
          PY
