services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SAFEGATE_DATABASE_URL: postgresql+asyncpg://safegate:safegate@db:5432/safegate
    volumes:
      - ./policies:/srv/policies:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safegate
      POSTGRES_PASSWORD: safegate
      POSTGRES_DB: safegate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safegate"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
