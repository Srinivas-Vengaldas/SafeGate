# Default policy. Copy to policies/<app>.yaml and send `X-SafeGate-App: <app>` to override per app.
screen_roles: [user]   # add `tool` to screen tool outputs for indirect injection

# Rails run in the order listed: cheap checks first, expensive ones last.
input_rails:
  rules:
    max_chars: 8000
    denylist:
      - ignore all previous instructions
      - ignore previous instructions
      - disregard your system prompt
      - you are now dan
    patterns:
      - '(?:reveal|print|show|repeat)\s+(?:your|the)\s+(?:system|hidden|initial)\s+(?:prompt|instructions)'
      - 'pretend\s+(?:that\s+)?you\s+(?:have|are)\s+no\s+(?:rules|restrictions|filters)'
  secrets:
    mode: redact          # API keys, tokens, private keys, "password is ..." values
  pii:
    mode: redact          # redact | block
    threshold: 0.4       # Presidio scores bare phone numbers at 0.4
    entities:
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - US_SSN
      - CREDIT_CARD
      - IBAN_CODE
      - IP_ADDRESS

# Rails run on the model's reply before the client sees it. With any output rail set, streamed
# replies are buffered, screened, then replayed, so time to first token becomes the full reply.
output_rails:
  secrets:
    mode: redact
  pii:
    mode: redact
    threshold: 0.4
    entities:
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - US_SSN
      - CREDIT_CARD
  # toxicity:                       # Detoxify's model exported to ONNX; see docs/toxicity.md
  #   model: models/toxicity-onnx
  #   threshold: 0.5

# Blocked chat requests get an OpenAI-style 400 error (error), or a normal completion whose
# message explains the block with finish_reason "content_filter" (refuse).
on_block: error

# Per client (API key, else IP address) and app. Backed by Redis when SAFEGATE_REDIS_URL is set.
# rate_limit:
#   requests: 60
#   per_seconds: 60
