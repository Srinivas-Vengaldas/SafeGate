[project]
name = "safegate"
version = "0.1.0"
description = "OpenAI-compatible LLM guardrails gateway with layered rails and a reproducible red-team benchmark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "redis>=5.0",
    # Attachments: images (OCR with the tesseract binary), PDFs, Word files.
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Injection classifier served from an exported ONNX model (no PyTorch). Used by the image.
onnx = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]
# Injection classifier served from a PyTorch checkpoint.
ml = [
    "torch>=2.4",
    "transformers>=5.0",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
# Dataset building, training and evaluation.
train = [
    "safegate[ml]",
    "datasets>=3.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "onnxruntime>=1.18",
    "onnx>=1.16",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "fakeredis>=2.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "rails/data/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
